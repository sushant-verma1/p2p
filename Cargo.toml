[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Versions are pinned to techstack.md. Nothing is added here that is not on that list.
[workspace.dependencies]
p2pchat-core = { path = "crates/p2pchat-core" }
p2pchat-crypto = { path = "crates/p2pchat-crypto" }
p2pchat-net = { path = "crates/p2pchat-net" }
p2pchat-store = { path = "crates/p2pchat-store" }
p2pchat-tui = { path = "crates/p2pchat-tui" }

anyhow = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
directories = "5"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
# `default-features = false` drops postcard's `heapless-cas` feature, whose
# `atomic-polyfill` is unmaintained (RUSTSEC-2023-0089). techstack.md asks for
# `use-std` and nothing else, which is what this is.
postcard = { version = "1", default-features = false, features = ["use-std"] }
# `default-features = false` drops quinn's `platform-verifier` (a web-PKI trust
# store this project has no use for — see architecture.md §3) and its
# `rustls-aws-lc-rs` default. `rustls-ring` is what techstack.md asks for.
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = "0.13"
# Same reason: `ring`, explicitly, not the default `aws-lc-rs` — which wants
# cmake and nasm and is the worse half of the choice on a GNU toolchain.
# `bundled` compiles SQLite from source, so the build does not depend on what
# the host happens to have installed — techstack.md.
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
# Exactly the features techstack.md lists. `io-util` and `process` are in
# p2pchat-net's dev-dependencies instead: they exist for the two-process
# integration test and have no business in a shipped binary.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
# `reusable_secrets` is on techstack.md's list; the handshake uses
# `EphemeralSecret`, which is consumed by the DH and zeroized on the spot.
x25519-dalek = { version = "2", features = ["reusable_secrets", "zeroize"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

proptest = "1"
tempfile = "3"
